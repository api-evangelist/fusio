      security:
      - app:
        - backend.connection
      summary: Backend connection create
      x-summary-source: derived
  /backend/connection/{connection_id}/database/{table_name}/rows:
    parameters:
    - name: connection_id
      in: path
      required: true
      schema:
        type: string
    - name: table_name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Connection
      description: Returns paginated rows at a table on a database
      operationId: backend.connection.database.getRows
      parameters:
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
      - name: count
        in: query
        required: false
        schema:
          type: integer
      - name: filterBy
        in: query
        required: false
        schema:
          type: string
      - name: filterOp
        in: query
        required: false
        schema:
          type: string
      - name: filterValue
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
      - name: columns
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend_DatabaseRowCollection'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.connection
      summary: Backend connection database get rows
      x-summary-source: derived
    post:
      tags:
      - Connection
      description: Creates a new row at a table on a database
      operationId: backend.connection.database.createRow

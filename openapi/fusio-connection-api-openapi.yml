openapi: 3.2.0
info:
  title: Fusio Connection API
  description: Self-Hosted API Management for Builders.
  version: '1'
servers:
- url: https://demo.fusio-project.org
tags:
- name: Connection
paths:
  /backend/connection/{connection_id}/agent:
    parameters:
    - name: connection_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Connection
      description: Sends a message to an agent
      operationId: backend.connection.agent.send
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Agent_Input'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent_Output'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.connection
      summary: Backend connection agent send
      x-summary-source: derived
  /backend/connection:
    get:
      tags:
      - Connection
      description: Returns a paginated list of connections
      operationId: backend.connection.getAll
      parameters:
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
      - name: count
        in: query
        required: false
        schema:
          type: integer
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: class
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend_ConnectionCollection'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.connection
      summary: Backend connection get all
      x-summary-source: derived
    post:
      tags:
      - Connection
      description: Creates a new connection
      operationId: backend.connection.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Backend_ConnectionCreate'
      responses:
        '201':
          description: ''

components:
  schemas:
    Backend_Connection:
      description: This object represents a connection to an external system like i.e. a database, message-queue or client-sdk
      type: object
      properties:
        id:
          description: Unique identifier for the object
          type: integer
        name:
          description: Unique name of the object
          type: string
        class:
          description: Underlying class of this connection which returns a configured client connection i.e. database, message-queue or client-sdk
          type: string
        oauth2:
          description: Indicates whether it is possible to start an OAuth2 authorization code flow on this connection
          type: boolean
        config:
          $ref: '#/components/schemas/Backend_ConnectionConfig'
        metadata:
          $ref: '#/components/schemas/Common_Metadata'
    Common_Metadata:
      type: object
      additionalProperties:
        type: string
    Agent_ItemBinary:
      allOf:
      - $ref: '#/components/schemas/Agent_Item'
      - description: Binary agent message
        type: object
        properties:
          mime:
            description: The mime of the binary data
            type: string
          data:
            description: The base64 encoded binary data
            type: string
    Backend_DatabaseTable:
      description: This object represents a relational table on a database connection
      type: object
      properties:
        name:
          description: Name of the table
          type: string
        columns:
          description: Available columns on the table
          type: array
          items:
            $ref: '#/components/schemas/Backend_DatabaseTableColumn'
        primaryKey:
          description: The primary key column
          type: string
        indexes:
          description: Available indices on the table
          type: array
          items:
            $ref: '#/components/schemas/Backend_DatabaseTableIndex'
        foreignKeys:
          description: Available foreign key constraints
          type: array
          items:
            $ref: '#/components/schemas/Backend_DatabaseTableForeignKeyConstraint'
    Backend_File:
      description: This object represents a file on the filesystem
      type: object
      properties:
        id:
          description: Unique identifier for the object
          type: string
        name:
          description: Name of the file
          type: string
        contentType:
          description: MIME type of the file

openapi: 3.2.0
info:
  title: Fusio Page API
  version: '1'
  description: 'Operations tagged page across 2 of this provider''s published API definitions: fusio-backend.json, fusio-consumer.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo.fusio-project.org
tags:
- name: Page
paths:
  /backend/page:
    get:
      tags:
      - Page
      description: Returns a paginated list of pages
      operationId: backend.page.getAll
      parameters:
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
      - name: count
        in: query
        required: false
        schema:
          type: integer
      - name: search
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend_PageCollection'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.page
      summary: Backend page get all
      x-summary-source: derived
    post:
      tags:
      - Page
      description: Creates a new page
      operationId: backend.page.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Backend_PageCreate'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.page
      summary: Backend page create
      x-summary-source: derived
    servers:
    - url: https://demo.fusio-project.org
  /backend/page/{page_id}:
    parameters:
    - name: page_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Page
      description: Returns a specific page
      operationId: backend.page.get
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend_Page'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.page
      summary: Backend page get
      x-summary-source: derived
    put:
      tags:
      - Page
      description: Updates an existing page
      operationId: backend.page.update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Backend_PageUpdate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.page
      summary: Backend page update
      x-summary-source: derived
    delete:
      tags:
      - Page
      description: Deletes an existing page
      operationId: backend.page.delete
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.page
      summary: Backend page delete
      x-summary-source: derived
    servers:
    - url: https://demo.fusio-project.org
  /consumer/page/{page_id}:
    parameters:
    - name: page_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Page
      description: Returns a specific page for the authenticated user
      operationId: consumer.page.get
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer_Page'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      summary: Consumer page get
      x-summary-source: derived
    servers:
    - url: https://demo.fusio-project.org
  /consumer/page:
    get:
      tags:
      - Page
      description: Returns a paginated list of pages which are relevant to the authenticated user
      operationId: consumer.page.getAll
      parameters:
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
      - name: count
        in: query
        required: false
        schema:
          type: integer
      - name: search
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer_PageCollection'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      summary: Consumer page get all
      x-summary-source: derived
    servers:
    - url: https://demo.fusio-project.org
components:
  schemas:
    Backend_PageCreate:
      $ref: '#/components/schemas/Backend_Page'
    Common_Metadata:
      type: object
      additionalProperties:
        type: string
    Backend_Page:
      description: This object represents a page at the developer portal
      type: object
      properties:
        id:
          description: Unique identifier for the object
          type: integer
        status:
          description: Status of the object either 1 = visible, 2 = invisible or 0 = deleted
          type: integer
        title:
          description: Title of the page
          type: string
        slug:
          description: Slug of the page which gets dynamically generated from the title
          type: string
        content:
          description: HTML content of this page
          type: string
        metadata:
          $ref: '#/components/schemas/Common_Metadata'
    Backend_PageUpdate:
      $ref: '#/components/schemas/Backend_Page'
    Backend_PageCollection:
      description: Base collection
      type: object
      properties:
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        entry:
          type: array
          items:
            $ref: '#/components/schemas/Backend_Page'
    Common_Message:
      description: Common error message
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: string
    Consumer_Page:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        metadata:
          $ref: '#/components/schemas/Common_Metadata'
    Consumer_PageCollection:
      description: Base collection
      type: object
      properties:
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        entry:
          type: array
          items:
            $ref: '#/components/schemas/Consumer_Page'
  securitySchemes:
    app:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://demo.fusio-project.org/authorization/token
          refreshUrl: https://demo.fusio-project.org/authorization/token
          scopes:
            backend: ''
            backend.account: ''
            backend.action: ''
            backend.agent: ''
            backend.app: ''
            backend.audit: ''
            backend.backup: ''
            backend.bundle: ''
            backend.category: ''
            backend.config: ''
            backend.connection: ''
            backend.cronjob: ''
            backend.dashboard: ''
            backend.event: ''
            backend.firewall: ''
            backend.form: ''
            backend.generator: ''
            backend.identity: ''
            backend.log: ''
            backend.marketplace: ''
            backend.operation: ''
            backend.page: ''

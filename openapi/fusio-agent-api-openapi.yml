      security:
      - app:
        - backend.agent
      summary: Backend agent get tools
      x-summary-source: derived
    servers:
    - url: https://demo.fusio-project.org
  /backend/agent/{agent_id}/message:
    parameters:
    - name: agent_id
      in: path
      required: true
      schema:

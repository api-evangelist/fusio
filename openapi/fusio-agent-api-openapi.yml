components:
  schemas:
    Agent_ItemToolCall:
      allOf:
      - $ref: '#/components/schemas/Agent_Item'
      - description: Tool call agent message
        type: object
        properties:
          functions:
            description: An array of concrete functions
            type: array
            items:
              $ref: '#/components/schemas/Agent_ItemToolCallFunction'
    Agent_ItemBinary:
      allOf:
      - $ref: '#/components/schemas/Agent_Item'
      - description: Binary agent message
        type: object
        properties:
          mime:
            description: The mime of the binary data
            type: string
          data:
            description: The base64 encoded binary data
            type: string
    Agent_Output:
      description: This object represents an agent output
      type: object
      properties:
        id:
          description: Chat id of this conversation
          type: string
        item:
          $ref: '#/components/schemas/Agent_Item'
    Agent_ItemText:
      allOf:
      - $ref: '#/components/schemas/Agent_Item'
      - description: Text agent message
        type: object
        properties:
          content:
            description: The content text
            type: string
    Agent_Item:
      oneOf:
      - $ref: '#/components/schemas/Agent_ItemBinary'
      - $ref: '#/components/schemas/Agent_ItemChoice'
      - $ref: '#/components/schemas/Agent_ItemObject'
      - $ref: '#/components/schemas/Agent_ItemText'
      - $ref: '#/components/schemas/Agent_ItemToolCall'
      discriminator: type
      mapping:
        binary: '#/components/schemas/Agent_ItemBinary'
        choice: '#/components/schemas/Agent_ItemChoice'
        object: '#/components/schemas/Agent_ItemObject'
        text: '#/components/schemas/Agent_ItemText'
        tool_call: '#/components/schemas/Agent_ItemToolCall'
    Backend_AgentCreate:
      $ref: '#/components/schemas/Backend_Agent'
    Backend_Agent:
      description: This object represents an agent
      type: object
      properties:
        id:
          description: Unique identifier for the object
          type: integer
        connection:
          description: The agent connection which should be used
          type: integer
        type:
          description: The agent type
          type: integer
        public:
          description: Indicates whether the agent is public
          type: boolean
        name:
          description: Name of the agent
          type: string
        description:
          description: Description of the agent
          type: string
        introduction:
          description: Introduction message
          type: string
        temperature:
          description: The used temperature default is 1.0
          type: number
        costs:
          description: Costs per token
          type: integer
        tools:
          description: Tools available to this agent
          type: array
          items:
            type: string
        outgoing:
          description: Describes the outgoing response payload, this must contain a schema name
          type: string
        action:
          description: Action which gets invoked for each generated response
          type: string
        insertDate:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Common_Metadata'
    Agent_Input:
      description: This object represents an agent input
      type: object
      properties:
        previousId:
          description: Optional the chat id of this conversation
          type: string
        item:
          $ref: '#/components/schemas/Agent_Item'
    Backend_AgentMessageCollection:
      description: Base collection
      type: object
      properties:
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        entry:
          type: array
          items:
            $ref: '#/components/schemas/Backend_AgentMessage'
    Common_Message:
      description: Common error message
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: string
    Agent_ItemChoice:
      allOf:
      - $ref: '#/components/schemas/Agent_Item'
      - description: Choice agent message
        type: object
        properties:
          items:
            description: Contains multiple agent items
            type: array
            items:
              $ref: '#/components/schemas/Agent_Item'
    Backend_AgentCollection:
      description: Base collection
      type: object
      properties:
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        entry:
          type: array
          items:
            $ref: '#/components/schemas/Backend_Agent'
    Backend_AgentUpdate:
      $ref: '#/components/schemas/Backend_Agent'
    Common_Metadata:
      type: object
      additionalProperties:
        type: string
    Backend_AgentMessage:
      description: This object represents an agent message
      type: object
      properties:
        id:
          description: Unique identifier for the object
          type: integer
        chatId:
          description: The assigned chat id which can be used to load the complete conversation
          type: string
        role:
          description: The role of this message i.e. user, assistant or system
          type: string
        item:
          $ref: '#/components/schemas/Agent_Item'
        insertDate:
          type: string
          format: date-time
    Agent_ItemToolCallFunction:
      description: Concrete values for a function tool call
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: string
    Backend_AgentTools:
      description: Represents a collection of available tools
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Backend_AgentTool'
    Agent_ItemObject:
      allOf:
      - $ref: '#/components/schemas/Agent_Item'
      - description: Structured agent message
        type: object
        properties:
          payload: {}
    Backend_AgentTool:
      description: Represents a concrete tool
      type: object
      properties:
        name:
          description: Name of the tool
          type: string
        description:
          description: Description of the tool
          type: string
    Consumer_AgentMessage:
      description: This object represents an agent message
      type: object
      properties:
        id:
          description: Unique identifier for the object
          type: integer
        chatId:
          description: The assigned chat id which can be used to load the complete conversation
          type: string
        role:
          description: The role of this message i.e. user, assistant or system
          type: string
        item:
          $ref: '#/components/schemas/Agent_Item'
        insertDate:
          type: string
          format: date-time
    Consumer_AgentMessageCollection:
      description: Base collection
      type: object
      properties:
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        entry:
          type: array
          items:
            $ref: '#/components/schemas/Consumer_AgentMessage'
    Consumer_Agent:
      description: This object represents an agent
      type: object
      properties:
        id:
          description: Unique identifier for the object
          type: integer
        name:
          description: Name of the agent
          type: string
        description:
          description: Description of the agent
          type: string
    Consumer_AgentCollection:
      description: Base collection
      type: object
      properties:
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        entry:
          type: array
          items:
            $ref: '#/components/schemas/Consumer_Agent'

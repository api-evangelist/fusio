openapi: 3.2.0
info:
  title: Fusio Agent API
  version: '1'
  description: 'Operations tagged agent across 2 of this provider''s published API definitions: fusio-backend.json, fusio-consumer.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo.fusio-project.org
tags:
- name: Agent
paths:
  /backend/agent:
    get:
      tags:
      - Agent
      description: Returns a paginated list of agents
      operationId: backend.agent.getAll
      parameters:
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
      - name: count
        in: query
        required: false
        schema:
          type: integer
      - name: search
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend_AgentCollection'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.agent
      summary: Backend agent get all
      x-summary-source: derived
    post:
      tags:
      - Agent
      description: Creates a new agent
      operationId: backend.agent.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Backend_AgentCreate'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.agent
      summary: Backend agent create
      x-summary-source: derived
    servers:
    - url: https://demo.fusio-project.org
  /backend/agent/{agent_id}:
    parameters:
    - name: agent_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Agent
      description: Returns a specific agent
      operationId: backend.agent.get
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend_Agent'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.agent
      summary: Backend agent get
      x-summary-source: derived
    put:
      tags:
      - Agent
      description: Updates an existing agent
      operationId: backend.agent.update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Backend_AgentUpdate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.agent
      summary: Backend agent update
      x-summary-source: derived
    delete:
      tags:
      - Agent
      description: Deletes an existing agent
      operationId: backend.agent.delete
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.agent
      summary: Backend agent delete
      x-summary-source: derived
    servers:
    - url: https://demo.fusio-project.org
  /backend/agent/tools:
    get:
      tags:
      - Agent
      description: Returns available tools for an agent
      operationId: backend.agent.getTools
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend_AgentTools'
        4XX:
          description: ''

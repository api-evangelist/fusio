                $ref: '#/components/schemas/Common_Message'
        5XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common_Message'
      security:
      - app:
        - backend.agent
      summary: Backend agent message get all
      x-summary-source: derived
    post:
      tags:
      - Agent
      description: Submits a new agent message
      operationId: backend.agent.message.submit
      requestBody:

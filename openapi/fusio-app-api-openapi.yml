openapi: 3.2.0
info:
  title: Fusio App API
  version: '1'
  description: 'Operations tagged app across 2 of this provider''s published API definitions: fusio-backend.json, fusio-consumer.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo.fusio-project.org
tags:
- name: App

currency_finding: >-
  Five of the six generated SDKs are at 7.0.11 published 2026-07-11. The Java SDK is at 5.1.8
  published 2024-08-03 and the Go SDK at v6.4.1 published 2026-01-31. A Java or Go consumer
  integrating against a current Fusio 7 instance is working from a client that predates the
  taxonomy system, the agent concept and the Api-Version header.

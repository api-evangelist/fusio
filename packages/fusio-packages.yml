description: >-
  Fusio publishes six first-party client SDKs, all generated from one TypeHub document
  (typehub.cloud d/fusio/sdk) by the provider's own SDKgen tooling, plus the server-side Composer
  packages that make up Fusio itself. Because the SDKs are generated from a single source, five of
  the six move in lockstep at 7.0.11 - and the sixth is the finding: the Java SDK on Maven Central
  is still at 5.1.8 from 2024-08-03, two majors and two years behind its own siblings, so a Java
  consumer is calling a Fusio 7 instance with a Fusio 5 client. The Go SDK is one major behind at
  v6.4.1.

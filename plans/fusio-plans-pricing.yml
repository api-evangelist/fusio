specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Fusio
providerId: fusio
generated: '2026-08-29'
method: searched
source: >-
  https://www.fusio-project.org/ (no pricing route exists; /pricing returns HTTP 404),
  https://github.com/apioo/fusio/blob/master/LICENSE,
  https://github.com/apioo/fusio/blob/master/composer.json (funding block)
created: '2026-05-04'
modified: '2026-08-29'
tags:
  - API Management
  - Open Source
  - Self-Hosted
plan_count: 0
pricing_model: none
description: >-
  Fusio publishes no plans and no prices, and that is the finding rather than a gap in our search.
  Fusio is Apache-2.0 software that the operator installs and runs; there is no vendor-hosted tier
  to buy, no free/pro/enterprise ladder, and no per-request billing relationship with the project.
  The website has no pricing route at all - https://www.fusio-project.org/pricing returns the Fusio
  404 envelope, and there is no pricing link in the site navigation or footer. Revenue for the
  project comes from voluntary sponsorship, not from plans.
plans: []
supersedes: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that invented three tiers (Free / Professional
  / Enterprise) with invented quotas of 1,000 and 100,000 requests per month. None of that was ever
  published by Fusio. It has been removed rather than carried forward.
evidence:
  - url: https://www.fusio-project.org/pricing
    status: 404
  - url: https://www.fusio-project.org/
    status: 200
    note: No pricing entry in navigation or footer.
  - url: https://github.com/apioo/fusio/blob/master/LICENSE
    status: 200
    note: Apache-2.0.
funding:
  model: sponsorship
  channels:
    - type: GitHub Sponsors
      url: https://github.com/sponsors/chriskapp
    - type: Patreon
      url: https://www.patreon.com/fusio
    - type: PayPal
      url: https://www.paypal.me/fusioapi
    - type: Partner program
      url: https://www.fusio-project.org/partner
      note: 'Named partners contributing to sustainability; one listed at time of probe (JetBrains, P-001).'
monetization_feature:
  note: >-
    Do not confuse this with Fusio's PLAN FEATURE. Fusio gives OPERATORS a monetization system so
    that THEY can sell plans for the APIs they build - a plan has a name, description, price,
    points and a one-time or subscription period, with an external_id that maps to a Stripe price
    id, and consumers spend points per operation call. That is a capability Fusio ships, not a
    price Fusio charges.
  docs: https://docs.fusio-project.org/docs/backend/monetization/plan
  operations:
    - backend.plan.getAll
    - backend.plan.create
    - consumer.plan.getAll
    - consumer.payment.checkout
    - consumer.payment.portal
    - consumer.transaction.getAll
    - system.payment.webhook

description: >-
  The entity-relationship graph of a Fusio instance's own configuration model, derived from the
  harvested contracts. Reading it top-down tells you what Fusio actually is: an OPERATION is the
  unit of publication, and it hangs off an ACTION (the logic), a SCHEMA (the shape), a SCOPE (who
  may call it) and a RATE (how often). A CONNECTION feeds the action its data source. An APP holds
  TOKENS for a USER. Everything below is that graph.
identifier_style: >-
  Integer surrogate keys. Path parameters accept either the numeric id or, on many endpoints, a
  name preceded by "~" (the routing pattern in the TypeAPI document is
  $action_id<[0-9]+|^~>), so entities are addressable by name as well as by id.

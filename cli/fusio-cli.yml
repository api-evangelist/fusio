provider: Fusio
providerId: fusio
name: Fusio CLI
binary: bin/fusio
description: 'Fusio ships a first-party Symfony-console CLI. It arrives two ways: as bin/fusio inside every Fusio installation,
  and as the standalone fusio/cli Composer package that talks to a remote Fusio instance over its own REST API. The remote
  form is the interesting one - it means the CLI is a first-class API client, not just a local admin tool, and it is what
  the deployment system and CI pipelines drive.'
install:

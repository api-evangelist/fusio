- group: deployment
  commands:
  - &id019
    name: deploy
    note: Reads the .yaml deployment configuration files and pushes the whole instance configuration through the internal
      REST API, so a Fusio installation can be reproduced from version control without sharing a database.
    docs: https://docs.fusio-project.org/docs/development/deployment_system
  - &id020

    evidence: https://github.com/apioo/fusio-impl/blob/master/.github/workflows/typehub.yml
key_flows:
- name: Reproduce an instance from version control
  steps:
  - php bin/fusio migrate
  - php bin/fusio deploy
- name: Serve the instance to an agent over MCP
  steps:
  - php bin/fusio mcp
- name: Publish the instance spec and regenerate SDKs
  steps:
  - php bin/fusio api:push sdk --filter=<name> --standalone

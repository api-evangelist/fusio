method: derived
source: >-
  openapi/fusio-backend.json, openapi/fusio-consumer.json, openapi/fusio-system.json,
  openapi/fusio-authorization.json (all harvested live from the Fusio reference instance)
  bound to the MCP tool surface defined in
  https://github.com/apioo/fusio-impl/blob/master/src/Service/Mcp/ToolLoader.php
provider: Fusio
providerId: fusio
title: Fusio MCP tool <-> REST operation crosswalk
description: >-
  Fusio's MCP server does not ship a hand-written tool list. Fusio\'s ToolLoader walks every
  ACTIVE operation registered in the instance and registers one MCP tool per operation, taking
  the tool name from the operation name, the tool inputSchema from the operation\'s generated
  input schema and the outputSchema from its response schema. The binding is therefore
  one-to-one and mechanical: every REST operation in the instance becomes exactly one MCP tool,
  and there are no MCP-only tools. The rows below bind the 275 operations Fusio\'s own reference
  instance exposes to the tool names its MCP server would register for them.
binding_rule:
  tool_name: operationId with "." replaced by "-" (Fusio\\Impl\\Service\\Agent\\ToolName::toToolName)
  tool_title: the operation name, verbatim
  input_schema: generated by Fusio\\Impl\\Service\\Agent\\InputSchemaBuilder from the operation parameters + request body
  output_schema: generated by Fusio\\Impl\\Service\\Agent\\OutputSchemaBuilder from the operation response
  annotations:
    readOnlyHint: true when the operation HTTP method is GET
    destructiveHint: true when the operation HTTP method is DELETE
    idempotentHint: true when the operation HTTP method is GET, PUT or DELETE
  caveat: >-
    ToolLoader skips any operation whose generated input schema is empty, so a small number of
    zero-argument operations may not appear as tools on a given instance. Which ones are skipped
    can only be established by an authenticated tools/list call against a running instance;
    Fusio's public demo has the HTTP MCP transport disabled (503 "MCP service is not enabled").
  evidence: https://docs.fusio-project.org/docs/protocol/mcp
surfaces:
  openapi:
    - openapi/fusio-backend.json
    - openapi/fusio-consumer.json
    - openapi/fusio-system.json
    - openapi/fusio-authorization.json
  mcp:
    url: https://{your-fusio-instance}/mcp
    transport: streamable-http
    gated: true
    note: >-
      HTTP transport is disabled by default (fusio_mcp config flag) and is marked experimental
      by the provider; STDIO transport via "php bin/fusio mcp" is the supported default.
  graphql:
    url: https://{your-fusio-instance}/graphql
    gated: true
    note: >-
      Fusio ships a GraphQL server (added in 6.1.0) but it is disabled by default; the reference
      instance answers 503 "GraphQL service is not enabled", so no SDL could be introspected.
  jsonrpc:
    url: https://{your-fusio-instance}/jsonrpc
    note: JSON-RPC server added in 6.1.0; not routed on the reference instance (404).
  openrpc: typeapi/fusio-backend-openrpc.json
coverage:
  rest_operations: 275
  mcp_tools_bound: 275
  mcp_only: 0
  rest_only: 0
  confidence: high

apis:
- aid: fusio:fusio-worker-api
  name: Fusio Worker API
  description: The Fusio Worker API enables executing API action logic in multiple programming languages
    by forwarding requests to external worker processes. Workers are implemented in the target language
    (JavaScript, Python, Java, PHP, etc.) and communicate with the Fusio core via a simple REST interface,
    enabling serverless deployments.
  humanURL: https://docs.fusio-project.org/docs/internal/worker_api
  baseURL: http://{worker_host}:9092
  tags:
  - Multi-Language
  - REST API
  - Serverless
  - Worker
  properties:
  - type: Documentation
    url: https://docs.fusio-project.org/docs/internal/worker_api
  - type: GitHubRepository
    url: https://github.com/apioo/fusio-worker-php
  x-base-url-note: Templated on purpose. A worker is a container the operator runs alongside Fusio, so
    its host is theirs; the port is the one the provider's own docker-compose publishes per language (java
    9090, javascript 9091, php 9092, python 9093). This entry tracks the PHP worker.

      - type: GitHubRepository
        url: https://github.com/apioo/fusio
  - aid: fusio:fusio-consumer-api
    name: Fusio Consumer API
    description: >-
      The Fusio Consumer API is used by the developer portal application and
      enables third-party developers to request access tokens, manage their
      apps, and interact with protected API endpoints. It provides the
      authentication and user management layer for API consumers.
    humanURL: https://docs.fusio-project.org/docs/backend/consumer/
    baseURL: https://demo.fusio-project.org
    tags:
      - Authentication
      - Consumer
      - Developer Portal
      - REST API
    properties:
      - type: Documentation
        url: https://docs.fusio-project.org/docs/backend/consumer/user/
      - type: APIReference
        url: https://demo.fusio-project.org/apps/redoc
      - type: OpenAPI
        url: openapi/fusio-consumer.json
      - type: Overlay
        url: overlays/fusio-consumer-overlay.yaml
      - type: GitHubRepository
        url: https://github.com/apioo/fusio
  - aid: fusio:fusio-worker-api
    name: Fusio Worker API
    description: >-
      The Fusio Worker API enables executing API action logic in multiple
      programming languages by forwarding requests to external worker processes.
      Workers are implemented in the target language (JavaScript, Python, Java,
      PHP, etc.) and communicate with the Fusio core via a simple REST
      interface, enabling serverless deployments.
    humanURL: https://docs.fusio-project.org/docs/internal/worker_api
    baseURL: 'http://{worker_host}:9092'
    tags:
      - Multi-Language
      - REST API
      - Serverless
      - Worker
    properties:
      - type: Documentation
        url: https://docs.fusio-project.org/docs/internal/worker_api
      - type: GitHubRepository
        url: https://github.com/apioo/fusio-worker-php
    x-base-url-note: >-
      Templated on purpose. A worker is a container the operator runs alongside Fusio, so its host
      is theirs; the port is the one the provider's own docker-compose publishes per language
      (java 9090, javascript 9091, php 9092, python 9093). This entry tracks the PHP worker.
  - aid: fusio:fusio-system-api
    name: Fusio System API
    description: >-
      The Fusio System API is the meta surface every Fusio instance exposes without configuration.
      It carries the discovery document at the root, the health check, the route table, and the
      specification generator that emits the instance's own OpenAPI, OpenRPC, TypeAPI and client
      SDK archives on demand. It is what makes a Fusio deployment self-describing: the contract is
      generated from the running instance rather than maintained beside it.
    humanURL: https://docs.fusio-project.org/docs/architecture
    baseURL: https://demo.fusio-project.org
    tags:
      - Discovery
      - Health
      - Meta
      - OpenAPI
      - REST API
    properties:
      - type: Documentation
        url: https://docs.fusio-project.org/docs/architecture
      - type: OpenAPI
        url: openapi/fusio-system.json
      - type: Overlay
        url: overlays/fusio-system-overlay.yaml
      - type: APICatalog
        url: well-known/fusio-api-catalog.json
      - type: GitHubRepository
        url: https://github.com/apioo/fusio
  - aid: fusio:fusio-authorization-api
    name: Fusio Authorization API
    description: >-
      The Fusio Authorization API is the OAuth2 authorization server Fusio ships in the product.
      It issues and refreshes access tokens across the authorization_code, client_credentials,
      password and refresh_token grants, resolves the identity behind a token, and revokes tokens.
      It is advertised through RFC 8414 authorization-server metadata, RFC 9728 protected-resource
      metadata and an OpenID Connect discovery document served from the same instance.
    humanURL: https://docs.fusio-project.org/docs/security/authorization
    baseURL: https://demo.fusio-project.org
    tags:
      - Authorization
      - OAuth2
      - OpenID Connect
      - REST API
      - Security
    properties:

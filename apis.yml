aid: fusio
name: Fusio
description: 'Fusio is Apache-2.0, self-hosted API management from apioo (Christoph Kappestein, Germany).
  An operator installs it and builds APIs inside it: an operation binds an HTTP method and path to an
  action (SQL, HTTP, MongoDB, Elasticsearch, an LLM agent, or code running in a JavaScript, Python, Java
  or PHP worker) and a TypeSchema-defined request and response shape. Every instance then generates its
  own machine-readable contract live - OpenAPI 3.0.3, OpenRPC 1.3.0 and TypeAPI - and serves an RFC 9727
  api-catalog, RFC 8414 and RFC 9728 OAuth metadata, OpenID Connect discovery and an RFC 9116 security.txt
  out of the box. It ships its own OAuth2 authorization server, an Angular developer portal, a rate-limiting
  and monetization layer, a webhook and trigger system, and an MCP server that turns every published operation
  into an agent tool. There is no vendor-hosted tier and no pricing: the software is the product.'
type: Index

apis:
  - aid: fusio:fusio-backend-api
    name: Fusio Backend API
    description: >-
      The Fusio Backend API provides a REST interface to configure and manage
      all aspects of a Fusio API management instance. It covers operations,
      routes, schemas, actions, connections, apps, users, and marketplace
      resources used by the Fusio backend application.
    humanURL: https://docs.fusio-project.org/docs/backend/
    baseURL: https://demo.fusio-project.org
    tags:

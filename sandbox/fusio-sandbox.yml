local_testing:
  description: >-
    Beyond the hosted demo, Fusio ships an in-product test surface for the APIs an operator
    builds: a test record per operation, a run-all command, and a test-coverage statistic.
  operations:
    - backend.test.getAll
    - backend.test.get
    - backend.test.update
    - backend.test.refresh
    - backend.test.run
    - backend.statistic.getTestCoverage

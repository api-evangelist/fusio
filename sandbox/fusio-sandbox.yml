description: >-
  Fusio runs a fully hosted, publicly credentialed instance of itself and publishes the login on
  its own website. That makes it an unusually complete sandbox for self-hosted software: rather
  than a fake key against a mock, a caller gets a real Fusio deployment with a real backend app, a
  real developer portal, a real ReDoc API reference and a live API root, and can call it before
  installing anything. Every spec in this repo's openapi/ directory was harvested from it.

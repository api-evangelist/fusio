provider: Fusio
providerId: fusio
docs: https://docs.fusio-project.org/docs/security/authorization
description: 'Fusio''s scope model is namespaced by category and then by resource: ''backend'' grants
  the whole backend surface, ''backend.operation'' grants only the operation resource within it, and the
  same shape repeats for ''consumer''. Scopes are instance data, not product constants - an operator creates
  their own alongside these through backend.scope.create - so this list is the 58 scopes Fusio''s own
  reference instance defines for its management surface. Personal access tokens can be issued against
  any subset.'
namespaces:
- prefix: backend
  grants: the entire backend management surface
  narrower: backend.<resource>
- prefix: consumer
  grants: the entire developer-portal surface
  narrower: consumer.<resource>
- prefix: system
  grants: meta, health, route table and spec generation
- prefix: authorization
  grants: token introspection and revocation
- prefix: openid
  grants: OIDC claims when Fusio acts as an identity provider
- prefix: default
  grants: the scope every app receives; the only one advertised anonymously
roles_note: Scopes are granted to a user through a ROLE (backend.role.*), and a role belongs to a category.
  An operator assigns scopes to roles rather than to users directly.
